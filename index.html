<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WESTRADES PRO | Institutional R_100 & M-Pesa Terminal</title>
<style>
  :root {
    --bg: #060911;
    --card: #0f1624;
    --card-2: #151f32;
    --border: #22304a;
    --text: #f8fafc;
    --muted: #94a3b8;
    --green: #10b981;
    --red: #ef4444;
    --gold: #f59e0b;
    --blue: #3b82f6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100dvh;
    background: radial-gradient(circle at top, #13213c 0%, #060911 70%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
  }
  .hidden { display: none !important; }

  #gate {
    min-height: 100dvh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 14px;
  }
  .portal-card {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 22px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    text-align: center;
  }
  .emblem {
    width: 54px;
    height: 54px;
    margin: 0 auto 14px;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(59,130,246,0.22), rgba(245,158,11,0.22));
    border: 1px solid rgba(245,158,11,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }
  .portal-title {
    font-size: 23px;
    font-weight: 900;
    letter-spacing: 0.6px;
    margin: 0 0 6px;
  }
  .portal-title span { color: var(--gold); }
  .portal-sub {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.45;
    margin: 0 0 18px;
  }
  .auth-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    background: var(--bg);
    padding: 5px;
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .toggle-btn {
    padding: 11px 8px;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .toggle-btn.active {
    background: var(--blue);
    color: #fff;
  }
  .form-group { text-align: left; }
  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin: 12px 0 6px;
  }
  input, select {
    width: 100%;
    padding: 13px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    outline: none;
  }
  input:focus, select:focus { border-color: var(--blue); }
  .forgot-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 8px;
  }
  .link-btn {
    background: none;
    border: none;
    color: var(--blue);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    padding: 0;
  }
  .btn {
    width: 100%;
    padding: 14px 16px;
    margin-top: 16px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
  }
  .btn-blue { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; }
  .btn-green { background: linear-gradient(135deg, #10b981, #059669); color: #042f1e; }
  .btn-red { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
  .btn-gold { background: linear-gradient(135deg, #f59e0b, #d97706); color: #111827; }
  .portal-foot {
    margin-top: 16px;
    font-size: 11px;
    color: var(--muted);
  }
  .msg {
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 13px;
    text-align: left;
    background: rgba(59,130,246,0.14);
    border: 1px solid rgba(59,130,246,0.35);
  }
  .msg.err { background: rgba(239,68,68,0.14); border-color: rgba(239,68,68,0.4); color: #fca5a5; }
  .msg.ok { background: rgba(16,185,129,0.14); border-color: rgba(16,185,129,0.4); color: #6ee7b7; }

  #app {
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: 14px 12px 44px;
  }
  .dash-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .tier-badge {
    display: inline-block;
    margin-top: 4px;
    font-size: 11px;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(245,158,11,0.16);
    color: var(--gold);
    border: 1px solid rgba(245,158,11,0.35);
  }
  .nav-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 12px;
  }
  .nav-tab {
    padding: 11px 6px;
    border: 1px solid var(--border);
    border-radius: 11px;
    background: var(--card);
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
  }
  .nav-tab.active {
    background: var(--blue);
    color: #fff;
    border-color: var(--blue);
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 12px 0;
  }
  .stat {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 6px;
    text-align: center;
  }
  .stat-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .stat-val { font-size: 17px; font-weight: 900; margin-top: 3px; }
  canvas {
    width: 100%;
    height: 220px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: block;
    margin: 10px 0;
  }
  .grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 10px;
  }
  .pill {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 4px;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
  }
  .row-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 11px 12px;
    margin-bottom: 8px;
    font-size: 13px;
  }
</style>
</head>
<body>

<div id="gate">
  <div class="portal-card">
    <div class="emblem">🔐</div>
    <h1 class="portal-title">WESTRADES <span>PRO</span></h1>
    <p class="portal-sub">Institutional R_100 Algorithmic Terminal &amp; Zero-Custody Deriv Execution</p>

    <div class="auth-toggle">
      <button type="button" class="toggle-btn active" id="tabLoginBtn" onclick="setGateMode('login')">PIN Unlock</button>
      <button type="button" class="toggle-btn" id="tabRegBtn" onclick="setGateMode('register')">Create Account</button>
    </div>

    <div class="form-group">
      <div id="regFields" class="hidden">
        <label for="regName">Full Name</label>
        <input id="regName" type="text" placeholder="John Doe" />

        <label for="regTier">Account Tier</label>
        <select id="regTier">
          <option value="Standard Trader">Standard Trader (Free Charting)</option>
          <option value="Pro Algorithmic">Pro Algorithmic (AI Scanner)</option>
        </select>
      </div>

      <label for="authEmail">Email Address</label>
      <input id="authEmail" type="email" placeholder="john.doe@gmail.com" />

      <div id="pinRow">
        <label for="authPin" id="pinLabel">6-Digit Security PIN</label>
        <input id="authPin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••" />
      </div>

      <div id="resetPhoneRow" class="hidden">
        <label for="resetPhone">Registered M-Pesa Phone (Verification)</label>
        <input id="resetPhone" type="tel" placeholder="0712345678" />
      </div>

      <div class="forgot-row" id="forgotRow">
        <button type="button" class="link-btn" onclick="setGateMode('forgot')">Forgot PIN?</button>
      </div>

      <button type="button" class="btn btn-blue" id="authSubmitBtn" onclick="handleGateAction()">Unlock Terminal</button>
      <div id="authMsg" class="msg hidden"></div>
    </div>

    <div class="portal-foot">Protected by TLS Encryption &amp; Cloud Session Lock</div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="dash-card">
    <div class="top-row">
      <div>
        <div style="font-size:18px;font-weight:900;">WESTRADES <span style="color:var(--gold);">PRO</span> • <span id="hdrName">Trader</span></div>
        <span class="tier-badge" id="hdrTier">Standard Trader</span>
      </div>
      <button type="button" class="toggle-btn" style="width:auto;padding:9px 14px;background:rgba(239,68,68,0.16);color:#fca5a5;border:1px solid rgba(239,68,68,0.35);" onclick="logoutUser()">Logout</button>
    </div>
  </div>

  <div class="nav-tabs">
    <button type="button" class="nav-tab active" id="navTerm" onclick="showTab('term')">Terminal</button>
    <button type="button" class="nav-tab" id="navHist" onclick="showTab('hist')">History</button>
    <button type="button" class="nav-tab" id="navPro" onclick="showTab('pro')">Pro M-Pesa</button>
    <button type="button" class="nav-tab" id="navApi" onclick="showTab('api')">Deriv API</button>
  </div>

  <div id="tabTerm" class="dash-card">
    <div class="auth-toggle" style="margin-bottom:0;">
      <button type="button" class="toggle-btn active" id="btnDemo" onclick="setMode('DEMO')">DEMO ($10,000)</button>
      <button type="button" class="toggle-btn" id="btnLive" onclick="setMode('LIVE')">LIVE DERIV</button>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-lbl">Balance</div>
        <div class="stat-val" id="valBal">$10,000.00</div>
